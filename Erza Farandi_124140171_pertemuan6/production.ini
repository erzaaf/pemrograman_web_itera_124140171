[app:main]
use = egg:pyramid_mahasiswa

pyramid.reload_templates = false
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.debug_routematch = false
pyramid.default_locale_name = en

# Database produksi: PostgreSQL
# Sesuaikan user, password, host, dan nama database dengan milik Anda.
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = *:6543

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
[loggers]
keys = root, pyramid_mahasiswa

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_pyramid_mahasiswa]
level = INFO
handlers =
qualname = pyramid_mahasiswa

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
