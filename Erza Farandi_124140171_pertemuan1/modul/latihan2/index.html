<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 2 - Data Mahasiswa</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    input { padding: 6px; }
    button { padding: 6px 10px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Latihan 2 - Array & CRUD Mahasiswa</h1>

  <div class="row">
    <button id="btn-tertinggi">Nilai Tertinggi</button>
    <button id="btn-diatas-rata">Di Atas Rata-rata</button>
    <button id="btn-sort-asc">Sort Nama A-Z</button>
    <button id="btn-sort-desc">Sort Nama Z-A</button>
    <button id="btn-reset">Reset</button>
  </div>
  <p id="info"></p>

  <h2>Tambah / Edit Mahasiswa</h2>
  <div class="row">
    <input id="f-nama" placeholder="Nama" />
    <input id="f-nim" placeholder="NIM" />
    <input id="f-jurusan" placeholder="Jurusan" />
    <input id="f-nilai" type="number" placeholder="Nilai" />
    <button id="btn-simpan">Simpan</button>
  </div>

  <h2>Daftar Mahasiswa</h2>
  <table>
    <thead><tr><th>No</th><th>Nama</th><th>NIM</th><th>Jurusan</th><th>Nilai</th><th>Aksi</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
