<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 3 - Form, API, Dark Mode, Todo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; background: #fff; color: #111; }
    body.dark { background: #111827; color: #f9fafb; }
    table { border-collapse: collapse; width: 100%; margin-top: 8px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: left; }
    input { padding: 6px; margin: 2px; }
    button { padding: 6px 10px; cursor: pointer; margin: 2px; }
    .error { color: red; font-size: 13px; }
    .done { text-decoration: line-through; color: gray; }
    section { border: 1px solid #ccc; padding: 12px; margin-bottom: 14px; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Latihan 3</h1>
  <button id="btn-dark">Toggle Dark Mode</button>

  <section>
    <h2>Form Mahasiswa (validasi + localStorage)</h2>
    <input id="m-nama" placeholder="Nama (min 3)" />
    <input id="m-nim" placeholder="NIM" />
    <input id="m-nilai" type="number" placeholder="Nilai 0-100" />
    <button id="m-simpan">Tambah</button>
    <p class="error" id="m-error"></p>
    <ul id="m-list"></ul>
  </section>

  <section>
    <h2>Daftar Post API (search + pagination)</h2>
    <input id="search" placeholder="Cari title..." />
    <button id="prev">Previous</button>
    <span id="page-info"></span>
    <button id="next">Next</button>
    <ul id="posts"></ul>
  </section>

  <section>
    <h2>Todo List (tambah / hapus / selesai + localStorage)</h2>
    <input id="t-input" placeholder="Tugas baru..." />
    <button id="t-add">Tambah</button>
    <ul id="t-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
