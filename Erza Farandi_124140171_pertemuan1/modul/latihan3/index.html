<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 3 - Form & Todo</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f1f5f9; color: #111827; max-width: 860px; margin: auto; }
    section { background: #fff; border: 1px solid #e2e8f0; padding: 16px; margin: 14px 0; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    input { padding: 9px 12px; margin: 4px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; transition: border .2s, box-shadow .2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
    .error { color: #ef4444; font-size: 13px; font-weight: bold; }
    .done span { text-decoration: line-through; color: gray; }
    ul { padding-left: 18px; }
    li.card-item { list-style: none; background: #f8fafc; border: 1px solid #e2e8f0; margin: 6px 0; padding: 8px 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #page-info { font-weight: bold; background: #e0e7ff; color: #3730a3; padding: 6px 12px; border-radius: 20px; margin: 0 4px; }

    .btn { padding: 9px 16px; margin: 4px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; color: #fff; transition: transform .15s, box-shadow .15s, filter .15s; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
    .btn:active { transform: scale(.96); }
    .btn-add { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-todo { background: linear-gradient(135deg, #059669, #047857); }
    .btn-prev { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .btn-next { background: linear-gradient(135deg, #ea580c, #dc2626); }
    .btn-clear { background: #fff; color: #dc2626; border: 2px solid #dc2626; box-shadow: none; }
    .btn-clear:hover { background: #dc2626; color: #fff; }
    .btn-del { background: #ef4444; padding: 5px 10px; font-size: 12px; border-radius: 8px; }
    .btn-del:hover { background: #b91c1c; }
  </style>
</head>
<body>
  <h1>Latihan 3</h1>

  <section>
    <h2>Form Mahasiswa (validasi + localStorage)</h2>
    <input id="m-nama" placeholder="Nama (min 3)" />
    <input id="m-nim" placeholder="NIM" />
    <input id="m-nilai" type="number" placeholder="Nilai 0-100" />
    <button id="m-simpan" class="btn btn-add">➕ Tambah</button>
    <button id="m-clear" class="btn btn-clear">Hapus Semua</button>
    <p class="error" id="m-error"></p>
    <ul id="m-list"></ul>
  </section>

  <section>
    <h2>Daftar Post API (search + pagination)</h2>
    <input id="search" placeholder="🔍 Cari title..." />
    <button id="prev" class="btn btn-prev">⬅ Previous</button>
    <span id="page-info"></span>
    <button id="next" class="btn btn-next">Next ➡</button>
  </section>

  <section>
    <h2>Todo List (tambah / hapus / selesai + localStorage)</h2>
    <input id="t-input" placeholder="Tugas baru..." />
    <button id="t-add" class="btn btn-todo">✔ Tambah</button>
    <ul id="t-list"></ul>
  </section>

  <script src="script.js"></script>
</body>
</html>
