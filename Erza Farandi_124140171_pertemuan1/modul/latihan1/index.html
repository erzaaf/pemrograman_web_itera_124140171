<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 1 - Dasar JavaScript</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 16px; max-width: 700px; margin: auto; }
    section { border: 1px solid #ccc; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    input, button { padding: 6px 10px; margin: 4px; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Latihan 1 - Dasar JavaScript</h1>

  <section>
    <h2>1. Data Diri (const & let)</h2>
    <pre id="out-diri"></pre>
  </section>

  <section>
    <h2>2. Cek Kelulusan (nilai &gt;= 70)</h2>
    <input id="in-lulus" type="number" value="75" />
    <button id="btn-lulus">Cek</button>
    <p id="out-lulus"></p>
  </section>

  <section>
    <h2>3. Kategori Umur</h2>
    <input id="in-umur" type="number" value="20" />
    <button id="btn-umur">Cek</button>
    <p id="out-umur"></p>
  </section>

  <section>
    <h2>4. Konversi Hari (switch-case)</h2>
    <input id="in-hari" type="number" min="1" max="7" value="3" />
    <button id="btn-hari">Konversi</button>
    <p id="out-hari"></p>
  </section>

  <section>
    <h2>5. Grade Nilai (ternary)</h2>
    <input id="in-grade" type="number" value="85" />
    <button id="btn-grade">Cek Grade</button>
    <p id="out-grade"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
