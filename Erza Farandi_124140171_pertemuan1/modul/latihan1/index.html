<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Latihan 1 - Dasar JavaScript</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; background: #f1f5f9; color: #111827; max-width: 700px; margin: auto; }
    section { background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
    input { padding: 9px 12px; margin: 4px; border: 2px solid #e2e8f0; border-radius: 10px; outline: none; transition: border .2s, box-shadow .2s; }
    input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,.2); }
    pre { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; }
    .btn { padding: 9px 16px; margin: 4px; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; color: #fff; transition: transform .15s, box-shadow .15s, filter .15s; box-shadow: 0 3px 8px rgba(0,0,0,.15); }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); box-shadow: 0 6px 14px rgba(0,0,0,.2); }
    .btn:active { transform: scale(.96); }
    .btn-blue { background: linear-gradient(135deg, #2563eb, #1d4ed8); }
    .btn-teal { background: linear-gradient(135deg, #0d9488, #0f766e); }
    .btn-purple { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .btn-orange { background: linear-gradient(135deg, #ea580c, #dc2626); }
  </style>
</head>
<body>
  <h1>Latihan 1 - Dasar JavaScript</h1>

  <section>
    <h2>1. Data Diri (const & let)</h2>
    <pre id="out-diri"></pre>
  </section>

  <section>
    <h2>2. Cek Kelulusan (nilai &gt;= 70)</h2>
    <input id="in-lulus" type="number" value="75" />
    <button id="btn-lulus" class="btn btn-blue">✔ Cek Lulus</button>
    <p id="out-lulus"></p>
  </section>

  <section>
    <h2>3. Kategori Umur</h2>
    <input id="in-umur" type="number" value="20" />
    <button id="btn-umur" class="btn btn-teal">✔ Cek Umur</button>
    <p id="out-umur"></p>
  </section>

  <section>
    <h2>4. Konversi Hari (switch-case)</h2>
    <input id="in-hari" type="number" min="1" max="7" value="3" />
    <button id="btn-hari" class="btn btn-purple">🔄 Konversi</button>
    <p id="out-hari"></p>
  </section>

  <section>
    <h2>5. Grade Nilai (ternary)</h2>
    <input id="in-grade" type="number" value="85" />
    <button id="btn-grade" class="btn btn-orange">★ Cek Grade</button>
    <p id="out-grade"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
